[project]
name = "qqpush"
version = "1.0.0"
description = "极轻量的 QQ 群消息转发服务：HTTP 推送 -> OneBot 11 -> QQ 群"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "qqpush" }]
keywords = ["qq", "qqbot", "onebot", "napcat", "webhook", "push"]
dependencies = [
    "websockets>=12.0",  # 仅用于官方通道接收事件（换取 group_openid）
]

[project.scripts]
qqpush = "qqpush.__main__:main"
qqpush-discover = "qqpush.discover:main"

[project.urls]
Homepage = "https://github.com/your-name/qqpush"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qqpush"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
exclude = [".venv", ".uv-cache", "data", "dist"]
extend-exclude = ["*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["qqpush"]
